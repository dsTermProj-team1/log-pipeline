plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'  // Gradle 6.x면 7.1.2 로
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    // LogEvent POJO 재사용 → uber jar 에 포함
    implementation project(':common')

    // JSON 파싱. uber jar 에 넣고, 런타임에 Hadoop 의 jackson 보다 우선시킴(Driver 에서 설정)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'

    // Reducer → ES 직접 적재 (EsOutputFormat). ES 8.13 서버와 마이너 버전 맞춤.
    // transitive=false: hadoop-client/commons-* 를 같이 끌고 오면 uber jar 가
    // 클러스터의 Hadoop 버전을 덮어써서(user.classpath.first) 깨질 수 있음.
    implementation('org.elasticsearch:elasticsearch-hadoop-mr:8.13.4') {
        transitive = false
    }

    // Hadoop 은 클러스터가 제공 → 컴파일만, jar 에는 절대 안 넣음
    compileOnly 'org.apache.hadoop:hadoop-client:3.3.6'
}

shadowJar {
    archiveBaseName.set('mapreduce-job')
    archiveClassifier.set('')   // → mapreduce-job.jar
}

tasks.named('build') { dependsOn 'shadowJar' }
