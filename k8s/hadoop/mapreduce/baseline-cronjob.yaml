# 1일 주기 배치 — 최근 7일 /results/hourly 를 EWMA 가중집계해
# 시간대별 필요 Pod 수(구간별)를 /results/baseline/latest 에 출력.
# 기존 mapreduce-hourly-agg 와 동일 이미지/마운트, 메인 클래스만 baseline.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: baseline-aggregation
  namespace: hadoop
spec:
  schedule: "0 19 * * *"           # 매일 04:00 KST (= 19:00 UTC). 저부하 시간대 갱신
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: submitter
              image: kevinpsj/mapreduce-job:0.2.6   # baseline 클래스 포함 버전
              imagePullPolicy: IfNotPresent
              env:
                - name: HADOOP_CONF_DIR
                  value: /etc/hadoop/conf
                - name: INPUT_BASE
                  value: "/results/hourly"          # 1차 잡 출력이 baseline 입력
                - name: EWMA_TMP
                  value: "/tmp/baseline-ewma"        # MR 중간 출력(매 실행 덮어씀)
                - name: OUTPUT_BASE
                  value: "/results/baseline/latest"  # updater 가 읽는 최종 출력
                # ── baseline 노브 (매니페스트 한 줄로 전환) ──
                - name: DECAY
                  value: "0.7"
                - name: LOOKBACK
                  value: "7"
                - name: ANCHOR_PODS
                  value: "4"
                - name: MIN_PODS
                  value: "1"
                - name: MAX_PODS
                  value: "6"
                # REF_DATE 미설정 → 드라이버가 '오늘'(컨테이너 UTC 기준) 사용.
                # 데모 재현 시에만 아래를 풀어 고정:
                - name: REF_DATE
                  value: "2026-05-31"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  echo "[submit] baseline input=${INPUT_BASE} out=${OUTPUT_BASE}" \
                       "decay=${DECAY} lookback=${LOOKBACK} anchor=${ANCHOR_PODS}"

                  # 입력(1차 집계 결과)이 없으면 갱신할 근거가 없으므로 정상 종료
                  if ! hdfs dfs -test -d "${INPUT_BASE}"; then
                    echo "[skip] ${INPUT_BASE} not found, nothing to aggregate"
                    exit 0
                  fi

                  # REF_DATE 가 설정돼 있으면 -D 로 주입(데모 재현), 없으면 드라이버가 오늘 사용
                  REF_ARG=""
                  if [[ -n "${REF_DATE:-}" ]]; then
                    REF_ARG="-D baseline.ref.date=${REF_DATE}"
                  fi

                  hadoop jar /opt/job/mapreduce-job.jar \
                    com.logpipeline.mapreduce.baseline.BaselineAggregationDriver \
                    ${REF_ARG} \
                    -D baseline.decay="${DECAY}" \
                    -D baseline.lookback="${LOOKBACK}" \
                    -D baseline.anchor.pods="${ANCHOR_PODS}" \
                    -D baseline.min.pods="${MIN_PODS}" \
                    -D baseline.max.pods="${MAX_PODS}" \
                    "${INPUT_BASE}" "${EWMA_TMP}" "${OUTPUT_BASE}"

                  echo "[done] baseline written to ${OUTPUT_BASE}"
                  hdfs dfs -cat "${OUTPUT_BASE}/part-r-00000" || true
              volumeMounts:
                - name: hadoop-conf
                  mountPath: /etc/hadoop/conf
          volumes:
            - name: hadoop-conf
              configMap:
                name: hadoop-conf   # 1차 잡과 동일 ConfigMap 재사용
