# NM이 자기 NodeId 를 결정할 때 결국 listener 의 reverse-DNS (`getCanonicalHostName`)
# 결과를 그대로 등록한다. 그래서 `-Dyarn.nodemanager.hostname` 만으로는 안 잡히고,
# pod 의 in-pod /etc/hosts 가 어떤 hostname 을 돌려주느냐가 결정한다.
# hostname + subdomain + headless service 조합을 쓰면 K8s 가 자동으로
# `<pod_ip> nm0.yarn-nodemanager-hl.hadoop.svc.cluster.local nm0` 를 /etc/hosts 에 박아주고,
# RM 도 동일 FQDN 을 cluster DNS 로 resolve → AM 컨테이너 launch 가능해진다.
apiVersion: v1
kind: Service
metadata:
  name: yarn-nodemanager-hl
  namespace: hadoop
  labels: { app: yarn, component: nodemanager }
spec:
  clusterIP: None
  selector: { app: yarn, component: nodemanager }
  ports:
    - { name: webui,     port: 8042 }
    - { name: localizer, port: 8040 }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: yarn-nodemanager
  namespace: hadoop
  labels: { app: yarn, component: nodemanager }
spec:
  selector:
    matchLabels: {app: yarn, component: nodemanager }
  template:
    metadata:
      labels: { app: yarn, component: nodemanager }
    spec:
      hostname: nm0                        # 단일 노드 전제. 노드 늘리면 hostname 충돌하니 재설계 필요.
      subdomain: yarn-nodemanager-hl
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: node-role.kubernetes.io/master,        operator: Exists, effect: NoSchedule }
      containers:
        - name: nodemanager
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: [ "yarn" ]
          args: [ "nodemanager" ]
          env:
            - name: HADOOP_CONF_DIR
              value: /etc/hadoop/conf
          ports:
            - { name: webui,     containerPort: 8042 }
            - { name: localizer, containerPort: 8040 }
          volumeMounts:
            - { name: hadoop-conf, mountPath: /etc/hadoop/conf }
          readinessProbe:
            httpGet: { path: /node, port: 8042 }
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests: { memory: "1Gi", cpu: "250m" }
            limits:   { memory: "5Gi" }
      volumes:
        - name: hadoop-conf
          configMap: { name: hadoop-conf }
