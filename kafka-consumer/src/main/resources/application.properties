spring.application.name=hdfs-sink-consumer
spring.main.banner-mode=off


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

app.kafka.topic=${KAFKA_TOPIC}
app.hdfs.uri=${HDFS_URI}
app.hdfs.base-path=${HDFS_BASE_PATH}

app.rolling.max-bytes=${ROLLING_MAX_BYTES}
app.rolling.max-messages=${ROLLING_MAX_MESSAGES}
app.rolling.check-interval-ms=${ROLLING_CHECK_INTERVAL_MS}


